<header class="ide-titlebar" aria-label="사이트 도구 모음">
  <div class="ide-window-controls" aria-hidden="true">
    <span></span><span></span><span></span>
  </div>
  <div class="ide-history-controls">
    <button type="button" class="ide-icon-button" data-history="back" aria-label="이전 페이지" title="이전 페이지"><i class="ri-arrow-left-line" aria-hidden="true"></i></button>
    <button type="button" class="ide-icon-button" data-history="forward" aria-label="다음 페이지" title="다음 페이지"><i class="ri-arrow-right-line" aria-hidden="true"></i></button>
  </div>
  <button class="ide-addressbar" id="ideAddressbar" type="button" aria-label="Command Palette 열기">
    <i class="ri-terminal-box-line" aria-hidden="true"></i>
    <span>{{ site.url | replace: "https://", "" }} / {% if page.layout == 'post' %}posts / {{ page.title | slugify }}{% else %}{{ page.title | default: "workspace" | slugify }}{% endif %}</span>
    <kbd><span class="mac-only">⌘</span><span class="win-only">Ctrl</span>K</kbd>
  </button>
  <div class="ide-titlebar-actions">
    <span class="ide-mobile-title">{{ page.title | default: site.title }}</span>
    <button class="ide-icon-button ide-theme-toggle" id="ideThemeToggle" type="button" aria-label="테마 전환" title="테마 전환"><i class="ri-contrast-2-line" aria-hidden="true"></i></button>
    <button class="ide-icon-button ide-context-toggle" id="ideContextToggle" type="button" aria-controls="contextPanel" aria-expanded="true" aria-label="목차 패널 숨기기" title="목차 패널 숨기기"><i class="ri-layout-right-line" aria-hidden="true"></i></button>
    <button class="ide-icon-button" id="ideFullscreen" type="button" aria-label="전체 화면" title="전체 화면"><i class="ri-fullscreen-line" aria-hidden="true"></i></button>
    <button class="ide-icon-button ide-mobile-menu" id="ideMobileMenu" type="button" aria-label="탐색 메뉴 열기" aria-expanded="false" aria-controls="explorerPanel"><i class="ri-menu-line" aria-hidden="true"></i></button>
  </div>
</header>
