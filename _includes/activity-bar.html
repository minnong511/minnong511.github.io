<aside class="ide-activity" aria-label="주요 탐색">
  <nav aria-label="작업 영역">
    <button class="ide-activity-item is-active" type="button" data-activity-panel="explorer" aria-controls="explorerPanel" aria-pressed="true" aria-label="탐색기" title="탐색기"><i class="ri-folder-3-line" aria-hidden="true"></i><span>Explorer</span></button>
    <button class="ide-activity-item" type="button" data-activity-panel="search" aria-controls="explorerPanel" aria-pressed="false" aria-label="검색" title="검색"><i class="ri-search-line" aria-hidden="true"></i><span>Search</span></button>
    <button class="ide-activity-item" type="button" data-activity-panel="source" aria-controls="explorerPanel" aria-pressed="false" aria-label="소스 제어" title="소스 제어"><i class="ri-git-branch-line" aria-hidden="true"></i><span>Source Control</span></button>
    <button class="ide-activity-item" type="button" data-activity-panel="run" aria-controls="explorerPanel" aria-pressed="false" aria-label="실행 및 디버그" title="실행 및 디버그"><i class="ri-bug-line" aria-hidden="true"></i><span>Run and Debug</span></button>
    <button class="ide-activity-item" type="button" data-activity-panel="extensions" aria-controls="explorerPanel" aria-pressed="false" aria-label="확장" title="확장"><i class="ri-puzzle-line" aria-hidden="true"></i><span>Extensions</span></button>
  </nav>
  <nav aria-label="계정 및 저장소">
    <button class="ide-activity-item" type="button" data-activity-panel="about" aria-controls="explorerPanel" aria-pressed="false" aria-label="소개와 바로가기" title="소개와 바로가기"><i class="ri-settings-3-line" aria-hidden="true"></i><span>Manage</span></button>
    <a class="ide-activity-item ide-activity-github" href="https://github.com/{{ site.owner_auth.github_login }}" target="_blank" rel="noreferrer" aria-label="GitHub" title="GitHub"><i class="ri-github-line" aria-hidden="true"></i><span>GitHub</span></a>
  </nav>
</aside>
