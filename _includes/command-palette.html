<div class="ide-palette" id="commandPalette" role="dialog" aria-modal="true" aria-labelledby="paletteTitle" hidden>
  <div class="ide-palette-card">
    <div class="ide-palette-input-wrap"><i class="ri-search-line" aria-hidden="true"></i><label class="sr-only" for="paletteInput">파일, 게시물 또는 명령 검색</label><input id="paletteInput" type="search" placeholder="Search files by name (append : to go to line or @ to go to symbol)" autocomplete="off" /><kbd>ESC</kbd></div>
    <div class="ide-palette-results" id="paletteResults" role="listbox"></div>
    <div class="ide-palette-recent">
      <div class="ide-palette-recent-heading"><span id="paletteTitle">RECENTLY OPENED</span><span>최근 열림</span></div>
      <div id="paletteRecent"></div>
    </div>
  </div>
</div>
