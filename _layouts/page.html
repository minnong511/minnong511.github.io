---
layout: default
---
<section class="page-hero{% if page.hide_page_title %} page-hero-hidden{% endif %}">
  <div class="site-shell narrow-shell">
    {% unless page.hide_page_title %}
      <div class="eyebrow reveal">MINNONG'S STUDY LOG · PAGE</div>
      <h1 class="page-title reveal">{{ page.title }}</h1>
    {% endunless %}
  </div>
</section>

<section class="page-section">
  <div class="site-shell narrow-shell">
    <article class="page-card prose reveal">
      {{ content }}
    </article>
  </div>
</section>
